name: Lint

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Install dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: ./... --config .golangci.yml